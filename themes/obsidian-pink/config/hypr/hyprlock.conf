# Obsidian Cyberpunk Hyprlock Configuration
# Colors:
#   Background: #0f0c16
#   Neon Pink:  #ff2a85
#   Purple:     #bd93f9
#   Foreground: #f1eef8

background {
    monitor =
    path = /home/d0kt0r/Pictures/wallpapers/a_mountain_with_trees_and_moon.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(ff2a85)
    inner_color = rgb(0f0c16)
    font_color = rgb(f1eef8)
    fade_on_empty = false
    placeholder_text = <span foreground="##bd93f9">Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgb(bd93f9)
    fail_color = rgb(ff5555)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    position = 0, -80
    halign = center
    valign = center
}

# Clock (Hours:Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(ff2a85)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(bd93f9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 40
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Hi, $USER 󰄛
    color = rgb(f1eef8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Lock / Session Indicator
label {
    monitor =
    text = 󰌾 Hyprland
    color = rgb(ff2a85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -145
    halign = center
    valign = center
}
