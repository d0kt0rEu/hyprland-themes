# ==============================================================================
# Theme: Neon Pink & Purple (Cyberpunk / Synthwave)
# Designed for high contrast, legibility, and vibrant aesthetics
# ==============================================================================

# Core Colors
foreground              #d5c0f2
background              #0f0c16
selection_foreground    #ffffff
selection_background    #381a5a

# Cursor
cursor                  #ff2a85
