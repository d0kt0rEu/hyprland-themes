# Deep Sea Cyan & Pine Theme

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/d0kt0r/Pictures/wallpapers/polyscape-everforest.png
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(215, 222, 232)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(127, 187, 179)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 45
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# USER AVATAR / GREETING
label {
    monitor =
    text =    $USER
    color = rgb(131, 192, 146)
    font_size = 16
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -45
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(127, 187, 179, 0.8)
    inner_color = rgba(30, 35, 38, 0.85)
    font_color = rgb(215, 222, 232)
    fade_on_empty = false
    placeholder_text = <span foreground="##7fbbb3"><i>Password...</i></span>
    hide_input = false
    check_color = rgb(131, 192, 146)
    fail_color = rgb(230, 126, 128)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(219, 188, 127)
    position = 0, -115
    halign = center
    valign = center
    rounding = 14
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}
