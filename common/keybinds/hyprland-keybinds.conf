# ==========================================
# Hyprland Keybindings Export
# (Functional only - independent of theme)
# ==========================================

$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, ~/.config/rofi/launcher.sh
bind = $mainMod, K, exec, ~/.config/rofi/cheatsheet/cheatsheet.sh
bind = $mainMod, equal, exec, ~/.config/rofi/calc.sh
bind = , XF86Calculator, exec, ~/.config/rofi/calc.sh
bind = $mainMod, M, exec, ~/.config/rofi/powermenu/type-2/powermenu.sh
bind = $mainMod, B, exec, killall -SIGUSR1 waybar
bind = $mainMod, Space, exec, ~/.config/waybar/scripts/lang-osd.sh

# Window Management
bind = $mainMod, C, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Transparency Controls
bind = $mainMod, bracketleft, exec, hyprctl dispatch setprop active opacity 0.8
bind = $mainMod, bracketright, exec, hyprctl dispatch setprop active opacity 1.0
bind = CTRL ALT, backslash, exec, hyprctl dispatch setprop active opacity 1.0

# Workspaces: Switch (Super + 1-9, 0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Workspaces: Move Active Window (Super + Shift + 1-9, 0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspaces: Special / Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspaces: Mouse Scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse Binds: Move / Resize Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware / Media Keys
bindel = , XF86AudioRaiseVolume, exec, ~/.config/waybar/scripts/volume-osd.sh raise
bindel = , XF86AudioLowerVolume, exec, ~/.config/waybar/scripts/volume-osd.sh lower
bindl  = , XF86AudioMute, exec, ~/.config/waybar/scripts/volume-osd.sh mute
bindl  = , XF86AudioMicMute, exec, ~/.config/waybar/scripts/volume-osd.sh mic-mute
bindel = , XF86MonBrightnessUp, exec, ~/.config/waybar/scripts/brightness-osd.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/waybar/scripts/brightness-osd.sh down
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPrev, exec, playerctl previous
