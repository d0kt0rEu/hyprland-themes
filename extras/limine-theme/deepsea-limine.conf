# ==============================================================================
#  LIMINE BOOTLOADER - DEEP SEA & EVERFOREST THEME
# ==============================================================================

# General Behavior
timeout: 7
default_entry: 1
remember_last_entry: yes
graphics: yes

# Display Resolution (Matches Native 1080p Monitor)
interface_resolution: 1920x1080

# Visual Styling & Background Wallpaper
wallpaper: boot():/EFI/BOOT/themes/deepsea/polyscape.png
wallpaper_style: stretched
backdrop: 1e2326

# Branding & Header
interface_branding: Arch Linux • Deep Sea System Boot
interface_branding_colour: 7fbbb3
interface_help_colour: 83c092
interface_help_colour_bright: 7fbbb3

# Terminal Window & Margins
term_font_scale: 1x1
term_font_spacing: 1
term_margin: 80
term_margin_gradient: 4

# Transparency & Translucent Glass Window (a0 = ~63% opacity)
term_background: a01e2326
term_foreground: d3c6aa
term_background_bright: a0272e33
term_foreground_bright: 7fbbb3

# Deep Sea / Everforest Palette:
# Normal: black; red; green; brown; blue; magenta; cyan; gray
term_palette: 1e2326;e67e80;83c092;dbbc7f;7fbbb3;d699b6;83c092;d3c6aa
# Bright: dark-gray; bright-red; bright-green; yellow; bright-blue; bright-magenta; bright-cyan; white
term_palette_bright: 7a8478;e67e80;a7c080;dbbc7f;7fbbb3;d699b6;83c092;e2e8e4

# ==============================================================================
#  BOOT ENTRIES
# ==============================================================================

/Arch Linux
    comment: Linux 6.x • Rolling Release (Zen/Arch)
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: root=UUID=ac65add0-8183-48fb-82a4-d490707e4914 rw acpi_enforce_resources=lax
    module_path: boot():/initramfs-linux.img

/Windows
    comment: Microsoft Windows 11 Boot Manager
    protocol: efi
    path: guid(f9aa0639-25b7-4969-ab51-abadc6e47fa3):/EFI/Microsoft/Boot/bootmgfw.efi
